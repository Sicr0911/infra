# Config compartida por ambos nodos del cluster.
#
# load_definitions carga exchanges/colas/bindings/DLQ desde definitions.json
# en el arranque, para que la topologia (ver definitions.json) exista sin
# tener que declararla a mano por consola ni depender de que cada
# microservicio la declare por su lado.
management.load_definitions = /etc/rabbitmq/definitions.json

# Politica razonable para un cluster de 2 nodos en un entorno de evaluacion:
# las colas se replican en ambos nodos (ha-mode: all) para que caerse un
# nodo no tumbe los mensajes en transito.
