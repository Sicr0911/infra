# Cluster RabbitMQ de 2 nodos + Management UI, para desplegar en ec2-mq
# (aparte de ec2-apps: ver infra/apps/compose.yml).
#
# Uso: desde infra/mq -> docker compose up -d --build
#
# rabbitmq1 es quien carga la topologia de definitions.json (exchanges,
# colas de flujo + sus DLQ, bindings) al primer arranque; rabbitmq2 se une
# al cluster de rabbitmq1 y hereda ese mismo estado, por lo que no necesita
# cargar las definiciones de nuevo.
#
# Los microservicios (ec2-apps) se conectan a este cluster por la IP publica
# de esta instancia via RABBITMQ_HOST/RABBITMQ_PORT (ver infra/apps/compose.yml).

networks:
  campuslab-mq-net:
    driver: bridge

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: campuslab-rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-campuslab-cluster-cookie}
      # El usuario/contraseña NO se define aqui: cuando load_definitions
      # esta activo (ver rabbitmq.conf), RabbitMQ ignora por completo
      # RABBITMQ_DEFAULT_USER/PASS y no crea ningun usuario si
      # definitions.json no trae uno -- el cluster queda sin login posible.
      # Las credenciales (usuario "campuslab") ya estan en definitions.json,
      # exportadas desde un nodo real con `rabbitmqctl export_definitions`
      # (no un hash inventado a mano). Password por defecto: "changeit".
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/conf.d/10-campuslab.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campuslab-mq-net

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: campuslab-rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-campuslab-cluster-cookie}
    ports:
      - "5673:5672"   # AMQP (puerto de host distinto para no chocar con rabbitmq1)
      - "15673:15672" # Management UI
    volumes:
      - rabbitmq2-data:/var/lib/rabbitmq
    # Se une al cluster de rabbitmq1 tras arrancar: espera a que rabbitmq1
    # este disponible, detiene la app (no el nodo Erlang), hace el join y
    # vuelve a levantar la app. Sin esto, cada nodo quedaria aislado en su
    # propio cluster de un solo miembro.
    command: >
      bash -c "
        rabbitmq-server -detached &&
        until rabbitmqctl -n rabbit@rabbitmq2 await_startup; do sleep 2; done &&
        rabbitmqctl -n rabbit@rabbitmq2 stop_app &&
        rabbitmqctl -n rabbit@rabbitmq2 join_cluster rabbit@rabbitmq1 &&
        rabbitmqctl -n rabbit@rabbitmq2 start_app &&
        tail -f /dev/null
      "
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmqctl", "-n", "rabbit@rabbitmq2", "cluster_status"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - campuslab-mq-net
