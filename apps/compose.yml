# Orquesta el frontend Angular, los 3 microservicios de CampusLab y una base
# de datos Oracle XE de desarrollo, todos en la misma red.
#
# Requisito de layout: este archivo asume que los 5 repos estan clonados
# como hermanos dentro de la misma carpeta, con estos nombres (los mismos
# que usa GitHub al clonar):
#
#   <carpeta-padre>/
#     infra/                                   <- este repo
#     ms-campuslab-catalog/                     (pom.xml en la raiz)
#     MS-Campuslab-Bookings/ms-campuslab-bookings/   (pom.xml aqui adentro)
#     MS-Campuslab-BFF/ms-campuslab-bff/             (pom.xml aqui adentro)
#     ms-campuslab-notify/                      (pom.xml en la raiz)
#     frontend-campuslab/                       (Dockerfile en la raiz)
#
# Uso: desde infra/apps -> docker compose up --build

networks:
  campuslab-net:
    driver: bridge

volumes:
  oracle-data:

services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: campuslab-oracle-db
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-changeit}
      APP_USER: ${DB_USERNAME:-campuslab}
      APP_USER_PASSWORD: ${DB_PASSWORD:-campuslab}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Schema DDL de ms-campuslab-catalog: se ejecuta una sola vez, en el
      # primer arranque. Bookings no necesita esto: su schema lo crea Flyway
      # automaticamente al iniciar.
      #
      # El DDL real se monta aparte (para no duplicarlo) y el wrapper en
      # db-init/ lo incluye tras cambiar explicitamente de contenedor/schema
      # (ver comentario en ese archivo: los scripts de startup de esta imagen
      # corren en la CDB root como SYS, no dentro del PDB del APP_USER).
      - ../../ms-campuslab-catalog/src/main/resources/db/oracle_schema.sql:/opt/oracle/catalog-schema-source.sql:ro
      - ./db-init/01-catalog-schema.sql:/container-entrypoint-initdb.d/startup/01-catalog-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - campuslab-net

  ms-campuslab-catalog:
    build:
      context: ../../ms-campuslab-catalog
    container_name: campuslab-catalog
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: XEPDB1
      DB_USERNAME: ${DB_USERNAME:-campuslab}
      DB_PASSWORD: ${DB_PASSWORD:-campuslab}
      # Servidores de mensajeria externos (fuera de este compose / VPC).
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-34.201.119.90:9092}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-54.234.173.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin_dev}
    ports:
      - "8081:8081"
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campuslab-net

  ms-campuslab-bookings:
    build:
      context: ../../MS-Campuslab-Bookings/ms-campuslab-bookings
    container_name: campuslab-bookings
    environment:
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: XEPDB1
      DB_USERNAME: ${DB_USERNAME:-campuslab}
      DB_PASSWORD: ${DB_PASSWORD:-campuslab}
      CATALOG_SERVICE_URL: http://ms-campuslab-catalog:8081
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:-http://localhost:8080/realms/campuslab}
      # Servidores de mensajeria externos (fuera de este compose / VPC).
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-34.201.119.90:9092}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-54.234.173.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin_dev}
    ports:
      - "8082:8082"
    depends_on:
      oracle-db:
        condition: service_healthy
      ms-campuslab-catalog:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campuslab-net

  ms-campuslab-bff:
    build:
      context: ../../MS-Campuslab-BFF/ms-campuslab-bff
    container_name: campuslab-bff
    environment:
      CATALOG_SERVICE_URL: http://ms-campuslab-catalog:8081
      BOOKINGS_SERVICE_URL: http://ms-campuslab-bookings:8082
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-c75374e8-15d8-446b-8c6c-291120e0c761}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-6bf386f7-c08e-4ab9-88cd-57f56b590e66}
      # Servidores de mensajeria externos (fuera de este compose / VPC).
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-34.201.119.90:9092}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-54.234.173.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    ports:
      - "8080:8080"
    depends_on:
      ms-campuslab-catalog:
        condition: service_healthy
      ms-campuslab-bookings:
        condition: service_healthy
    networks:
      - campuslab-net

  ms-campuslab-notify:
    build:
      context: ../../ms-campuslab-notify
    container_name: campuslab-notify
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-54.234.173.1}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin_dev}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - campuslab-net

  ms-campuslab-frontend:
    build:
      context: ../../frontend-campuslab
    container_name: campuslab-frontend
    ports:
      - "80:80"
    depends_on:
      - ms-campuslab-bff
    networks:
      - campuslab-net
